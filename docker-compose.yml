
services:
  backend:
    build:
      context: ./backend
    container_name: student-backend
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: student-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000/submit
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
